[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-coding-agent"
version = "0.1.0"
description = "CLI-first transparent coding agent runtime"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "huguotao7412" }]
keywords = ["coding-agent", "cli", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.28",
    "mcp>=1.0",
    "rich>=13",
    "python-dotenv>=1.0",
    "e2b>=2.11,<3",
]

[project.scripts]
sca = "cli.main:main"
sca-eval = "evals.cli:main"
sca-harbor-agent = "evals.harbor_entrypoint:main"
sca-web = "web.cli:main"

[project.urls]
Homepage = "https://github.com/huguotao7412/simple_coding_agent"
Repository = "https://github.com/huguotao7412/simple_coding_agent"
Issues = "https://github.com/huguotao7412/simple_coding_agent/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]
web = [
    "streamlit>=1.40",
]
benchmark = [
    "harbor>=0.18,<0.19",
    # Newer LiteLLM releases currently fall back to a Rust source build on Windows.
    "litellm==1.83.14",
    "setuptools>=75",
    "wheel",
]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "evals*", "web*"]

[tool.mypy]
strict = true
python_version = "3.12"
follow_imports = "silent"
exclude = [".venv", ".worktrees", "__pycache__"]
ignore_missing_imports = true
files = [
    "core/a2a_lite",
    "core/execution",
    "core/config.py",
    "core/model_names.py",
    "core/sandbox",
    "core/actors/contracts.py",
    "core/policy.py",
    "core/paths.py",
    "core/lifecycle.py",
    "core/events.py",
    "core/runs/models.py",
    "core/runs/store.py",
    "core/runs/sqlite_store.py",
    "core/runs/context.py",
    "core/runs/task_state.py",
    "core/runtime/engine.py",
    "core/planner.py",
    "core/actors/agent.py",
    "core/actors/worktree.py",
    "core/git_utils.py",
    "core/verification",
    "core/mcp/client.py",
    "core/tools/update_state.py",
    "core/tools/delegate.py",
    "core/tools/apply_patch.py",
    "core/tools/file_ops.py",
    "core/tools/read.py",
    "core/tools/sandbox_run.py",
    "cli/report.py",
    "cli/runs.py",
    "cli/main.py",
    "evals/run_evals.py",
    "evals/harbor_entrypoint.py",
    "evals/harbor_runner.py",
    "evals/harbor_support.py",
]

[[tool.mypy.overrides]]
module = ["deepseek_tokenizer", "streamlit", "dotenv", "rich"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    ".worktrees",
    "node_modules",
    "evals/fixtures",
    "tmp",
]
