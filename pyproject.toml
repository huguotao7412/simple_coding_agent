[project]
name = "simple-coding-agent"
version = "0.1.0"
description = "CLI-first transparent coding agent runtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.0",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.scripts]
sca = "cli.main:main"
sca-eval = "evals.cli:main"
sca-web = "web.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]
web = [
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "evals*", "web*"]

[tool.mypy]
strict = true
python_version = "3.12"
follow_imports = "silent"
exclude = [".venv", ".worktrees", "__pycache__"]
ignore_missing_imports = true
files = [
    "core/actor_execution.py",
    "core/policy.py",
    "core/events.py",
    "core/run_context.py",
    "core/runtime.py",
    "core/planner.py",
    "core/agent.py",
    "core/worktree_actor_executor.py",
    "core/mcp/client.py",
    "core/tools/update_state.py",
    "core/tools/delegate.py",
    "cli/report.py",
    "evals/run_evals.py",
]

[[tool.mypy.overrides]]
module = ["deepseek_tokenizer", "streamlit", "dotenv", "rich"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    ".worktrees",
    "node_modules",
    "evals/fixtures",
    "tmp",
]
