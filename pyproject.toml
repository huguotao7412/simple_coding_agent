[project]
name = "simple-coding-agent"
version = "0.1.0"
description = "A pure-ReAct local coding assistant agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "rich>=13",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.scripts]
sca = "cli.main:main"
sca-web = "web.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "web*"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [".venv", ".worktrees", "__pycache__"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deepseek_tokenizer", "streamlit", "dotenv", "rich"]
ignore_missing_imports = true
