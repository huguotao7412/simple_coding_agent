name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Verify test suite inventory
        run: >-
          python -c "from pathlib import Path;
          root = Path('tests');
          files = list(root.glob('test_*.py')) if root.is_dir() else [];
          assert len(files) >= 8, f'expected at least 8 test modules, found {len(files)}'"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Type check trusted runtime modules
        run: >-
          python -m mypy
          core/execution
          core/actors/contracts.py core/policy.py core/events.py
          core/runs/models.py core/runs/store.py core/runs/sqlite_store.py
          core/runs/context.py core/runtime/engine.py core/actors/worktree.py
          core/verification
          core/planner.py core/actors/agent.py core/mcp/client.py
          core/tools/update_state.py core/tools/delegate.py
          cli/report.py cli/runs.py cli/main.py evals/run_evals.py

      - name: Compile Python sources
        run: python -m compileall -q core cli web evals tests

      - name: Validate eval fixture preparation
        run: python -m evals.cli prepare
