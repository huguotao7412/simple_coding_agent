name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q core cli web evals tests

      - name: Validate eval discovery
        run: python -m evals.run_evals --dry-run
